<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Peer-reviewed publications by Igor Santos-Grueiro, rendered from BibTeX.">
  <title>Publications | Igor Santos-Grueiro</title>
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="shortcut icon" href="assets/favicon.ico">
  <link rel="stylesheet" href="assets/styles.css?v=20260525-12">
</head>
<body>
  <div class="page-shell">
    <header class="site-header" aria-label="Site header">
      <div>
        <p class="terminal-path">/home/isg/publications</p>
        <h1>Igor Santos-Grueiro</h1>
      </div>
      <label class="theme-control">
        <input type="checkbox" data-theme-toggle>
        <span>light mode</span>
      </label>
    </header>

    <nav class="site-nav" aria-label="Primary navigation" data-nav>
      <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="site-menu" data-menu-toggle>menu</button>
      <div class="site-menu" id="site-menu">
        <a href="index.html">home</a>
        <a class="active" href="publications.html">publications</a>
        <a href="students.html">students</a>
        <a href="more.html">more</a>
      </div>
    </nav>

    <main class="terminal-panel">
      <section class="terminal-section">
        <p class="prompt">$ ./render-publications publications.bib</p>
        <p>
          You can find the full list of publications in my
          <a href="https://scholar.google.es/citations?user=ieVO6-kAAAAJ">Google Scholar profile</a>.
        </p>
      </section>

      <section class="terminal-section" data-publications>
        <form class="filter-bar" id="publication-filters">
          <label>
            search
            <input id="publication-search" type="search" autocomplete="off" placeholder="title, author, venue">
          </label>
          <label>
            year
            <select id="year-filter"></select>
          </label>
          <label>
            type
            <select id="type-filter"></select>
          </label>
          <button type="reset">clear</button>
        </form>

        <div class="publication-status" id="publication-status" aria-live="polite">loading publications.bib...</div>
        <div class="publication-list" id="publication-list"></div>
      </section>
    </main>
  </div>

  <script src="assets/site.js?v=20260525-12"></script>
</body>
</html>
